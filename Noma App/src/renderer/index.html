<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      img-src explicitly adds `data:` on top of the `default-src 'self'`
      baseline — real OS-extracted application icons (see
      main/applications/iconService.ts) arrive in the renderer as
      `data:image/png;base64,...` strings, which `'self'` alone does NOT
      cover (a `data:` URI has no origin, so it never matches `'self'`).
      Without this, every `<img src="data:...">` in AppIcon.tsx is silently
      blocked by CSP — no console-visible broken-image icon, no error
      surfaced to the component, just a real icon that never paints.
      Confirmed by hand: removing this reproduces exactly that silent
      failure in a running build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noma</title>
  </head>
  <body>
    <!--
      THESIS: Noma wears the colour of the app you're in (App Spaces): the
      window frame, the page wash and the trackpad take the current app's
      hue, refusing the one-accent dark dashboard with eyebrow labels.
      OWN-WORLD: warm graphite ground, off-white ink for anything you press,
      one OKLCH hue per app (lib/appSpace.ts) meaning only "where you are",
      violet only for Flow's notes, Sora display, real offset shadows.
      STORY: you see whose four actions you're looking at before reading a
      word; Flow's suggestion is a separate violet note.
      FIRST VIEWPORT: sidebar on the app's colour with an "In <app>" plate;
      Home opens on the app name at 34px, then the trackpad (600px, mirrored
      zones lit from the swipe edge), then Flow's note.
      FORM: grounded candidate 7 of 7, seed a0b0a804.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
