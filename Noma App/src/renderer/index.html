<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      img-src explicitly adds `data:` on top of the `default-src 'self'`
      baseline — real OS-extracted application icons (see
      main/applications/iconService.ts) arrive in the renderer as
      `data:image/png;base64,...` strings, which `'self'` alone does NOT
      cover (a `data:` URI has no origin, so it never matches `'self'`).
      Without this, every `<img src="data:...">` in AppIcon.tsx is silently
      blocked by CSP — no console-visible broken-image icon, no error
      surfaced to the component, just a real icon that never paints.
      Confirmed by hand: removing this reproduces exactly that silent
      failure in a running build.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noma</title>
  </head>
  <body>
    <!--
      THESIS: Noma should read as a premium hardware companion (Apple /
      Logitech / WHOOP), not a dev-tool prototype — refusing the flat-card,
      shouting-uppercase-micro-label "engineering dashboard" default.
      OWN-WORLD: Near-black ground unchanged. Elevated surfaces get real
      materiality — soft gradient sheen, inset top highlight, ambient
      shadow, backdrop-blur wherever real content actually sits behind
      (modals, floating tooltips). The signature blue accent glows rather
      than flat-fills. Generous radius: 2xl standard, 3xl for modals.
      STORY: Opening the app reads as a considered hardware product —
      tactile, layered, glass — not a prototype.
      FIRST VIEWPORT: The sidebar becomes a floating glass rail with a
      glowing active pill and a blurred tooltip; Dashboard's cards gain
      real depth (shadow + highlight) without changing content or layout.
      FORM: Refinement of the incumbent React/Tailwind system — no
      rewrite, no new UI framework. Direction is brief-pinned (Apple/
      Logitech/WHOOP + the sibling Noma Website's existing GLASS nav
      technique), so no concept-seed roll.
      FINISH: unreviewed and undocumented is unfinished; this build ends
      with the finish review, the verdict, DESIGN.md, and every shipping
      raster carrying its provenance.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
